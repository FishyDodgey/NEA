<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Orders</title>

<style>
body { 
    font-family: Arial, sans-serif; 
    background:#f4f6f8; 
    text-align:center; 
    padding:20px;
}

button { 
    padding:10px 15px; 
    margin:6px; 
    cursor:pointer; 
    border:none;
    border-radius:5px;
    font-weight:bold;
}

.btn-return { background:#6c757d; color:white; }
.btn-api { background:#007bff; color:white; }
.btn-add { background:#28a745; color:white; }
.btn-delete { background:#dc3545; color:white; }
.btn-refresh { background:#17a2b8; color:white; }

#status {
    margin:10px;
    color:#555;
    font-style:italic;
}

table {
    border-collapse: collapse;
    width:90%;
    margin:20px auto;
    background:white;
}

th {
    background:#e6e6e6;
    padding:10px;
    border:1px solid #ccc;
}

td {
    border:1px solid #ccc;
    padding:8px;
}

td[contenteditable="true"] { 
    background:#fffdf5; 
    cursor:pointer;
}

tr.selected { 
    background:#c8e6c9; 
}
</style>
</head>

<body>

<h1>Business Orders</h1>

<p id="status">Waiting for connection...</p>

<a href="blank.html"><button class="btn-return">Return</button></a>
<a href="PageT.html"><button class="btn-api">API</button></a>

<br>

<button class="btn-add" onclick="addRow()">Add Row</button>
<button class="btn-delete" onclick="deleteRow()">Delete Selected</button>
<button class="btn-refresh" onclick="loadTable()">Refresh</button>

<table id="businessTable">
<thead>
<tr>
    <th>Business</th>
    <th>Metal</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Thickness</th>
    <th>OrderID</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>
/* ==============================
   SUPABASE SETTINGS
   ============================== */

const supabaseUrl = "https://dtlkoxesvryluntpkxst.supabase.co";

// Paste your anon public key here
const supabaseKey = "sb_publishable_oFej7rbKhkstLjb0Po5fHQ_oA7G-3u_";

const statusText = document.getElementById("status");

let selectedOrderID = null;

/* ==============================
   READ - LOAD SUPABASE TABLE
   ============================== */

async function loadTable() {
    statusText.textContent = "Loading data from Supabase...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Businessorders?select=*&order=business.asc`,
        {
            method: "GET",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                Accept: "application/json"
            }
        }
    );

    const data = await response.json();

    if (!response.ok) {
        console.error(data);
        statusText.textContent = "Error: " + data.message;
        return;
    }

    statusText.textContent = "Connected successfully.";

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach(row => {
        const tr = document.createElement("tr");

        tr.dataset.orderid = row.orderID;

        tr.onclick = () => {
            document.querySelectorAll("#businessTable tbody tr")
                .forEach(r => r.classList.remove("selected"));

            tr.classList.add("selected");
            selectedOrderID = row.orderID;
        };

        tr.innerHTML = `
            <td contenteditable="true" onblur="updateCell(this, 'business')">${row.business}</td>
            <td contenteditable="true" onblur="updateCell(this, 'metal')">${row.metal}</td>
            <td contenteditable="true" onblur="updateCell(this, 'price')">${row.price}</td>
            <td contenteditable="true" onblur="updateCell(this, 'quantity')">${row.quantity}</td>
            <td contenteditable="true" onblur="updateCell(this, 'thickness')">${row.thickness}</td>
            <td>${row.orderID}</td>
        `;

        tbody.appendChild(tr);
    });
}

/* ==============================
   CREATE - ADD ROW
   ============================== */

async function addRow() {
    const business = prompt("Enter business number:");

    if (!business) return;

    const fakeOrderID = Date.now();

    const newRow = {
        business: parseInt(business),
        metal: "aluminium",
        price: 0,
        quantity: "0x0",
        thickness: 0,
        orderID: fakeOrderID
    };

    console.log("Sending this to Supabase:", newRow);

    statusText.textContent = "Adding row...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Businessorders`,
        {
            method: "POST",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                "Content-Type": "application/json",
                Prefer: "return=representation"
            },
            body: JSON.stringify(newRow)
        }
    );

    const result = await response.json();

    if (response.ok) {
        statusText.textContent = "Row added.";
        loadTable();
    } else {
        console.error(result);
        alert("Add failed: " + result.message);
    }
}

/* ==============================
   UPDATE - EDIT CELL
   ============================== */

async function updateCell(cell, columnName) {
    const tr = cell.parentElement;
    const orderID = tr.dataset.orderid;

    let newValue = cell.textContent.trim();

    if (columnName === "business" || columnName === "price") {
        newValue = parseInt(newValue);

        if (isNaN(newValue)) {
            alert(columnName + " must be a whole number.");
            loadTable();
            return;
        }
    }

    if (columnName === "thickness") {
        newValue = parseFloat(newValue);

        if (isNaN(newValue)) {
            alert("Thickness must be a number.");
            loadTable();
            return;
        }
    }

    const updatedData = {};
    updatedData[columnName] = newValue;

    statusText.textContent = "Updating...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Businessorders?orderID=eq.${orderID}`,
        {
            method: "PATCH",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updatedData)
        }
    );

    if (response.ok) {
        statusText.textContent = "Update saved.";
    } else {
        const err = await response.json();
        console.error(err);
        alert("Update failed: " + err.message);
        loadTable();
    }
}

/* ==============================
   DELETE - DELETE SELECTED ROW
   ============================== */

async function deleteRow() {
    if (!selectedOrderID) {
        alert("Select a row first.");
        return;
    }

    if (!confirm("Delete this business order?")) return;

    statusText.textContent = "Deleting...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Businessorders?orderID=eq.${selectedOrderID}`,
        {
            method: "DELETE",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`
            }
        }
    );

    if (response.ok) {
        selectedOrderID = null;
        statusText.textContent = "Row deleted.";
        loadTable();
    } else {
        const err = await response.json();
        console.error(err);
        alert("Delete failed: " + err.message);
    }
}

/* ==============================
   START PAGE
   ============================== */

loadTable();

</script>

</body>
</html>
