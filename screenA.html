<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Sheets</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    text-align:center;
    padding:20px;
}

.welcome-container {
    background:white;
    padding:20px;
    border-radius:10px;
    display:inline-block;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

button {
    padding:10px 15px;
    margin:6px;
    cursor:pointer;
    border:none;
    border-radius:5px;
    font-weight:bold;
}

.btn-return { background:#6c757d; color:white; }
.btn-add { background:#28a745; color:white; }
.btn-delete { background:#dc3545; color:white; }
.btn-refresh { background:#007bff; color:white; }

#status {
    color:#555;
    font-style:italic;
    margin:10px;
}

table {
    border-collapse:collapse;
    width:90%;
    max-width:900px;
    margin:20px auto;
    background:white;
}

th, td {
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th {
    background:#e6e6e6;
}

td[contenteditable="true"] {
    background:#fffdf5;
    cursor:pointer;
}

tr.selected {
    background:#c8e6c9;
}
</style>
</head>

<body>

<div class="welcome-container">
    <h1>New Sheets</h1>

    <p id="status">Waiting for connection...</p>

    <div class="button-row">
        <a href="page1.html"><button class="btn-return">Return</button></a>
        <button class="btn-add" onclick="addRow()">Add Row</button>
        <button class="btn-delete" onclick="deleteRow()">Delete Selected</button>
        <button class="btn-refresh" onclick="loadTable()">Refresh</button>
    </div>
</div>

<table id="myTable">
    <thead>
        <tr>
            <th>Metal</th>
            <th>New sheets</th>
            <th>Size</th>
            <th>Thickness</th>
            <th>Warehouse</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script>
/* ==============================
   SUPABASE SETTINGS
   ============================== */

const supabaseUrl = "https://dtlkoxesvryluntpkxst.supabase.co";

// Paste your anon public key here
const supabaseKey = "dtlkoxesvryluntpkxst";

const statusText = document.getElementById("status");

let selectedMetal = null;

/* ==============================
   READ - LOAD DATA
   ============================== */

async function loadTable() {
    statusText.textContent = "Loading data from Supabase...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Newsheets?select=*`,
        {
            method: "GET",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                Accept: "application/json"
            }
        }
    );

    const data = await response.json();

    if (!response.ok) {
        console.error(data);
        statusText.textContent = "Error: " + data.message;
        return;
    }

    statusText.textContent = "Connected successfully.";

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach(row => {
        const tr = document.createElement("tr");

        tr.dataset.metal = row["Metal"];

        tr.onclick = () => {
            document.querySelectorAll("#myTable tbody tr")
                .forEach(r => r.classList.remove("selected"));

            tr.classList.add("selected");
            selectedMetal = row["Metal"];
        };

        tr.innerHTML = `
            <td contenteditable="true" onblur="updateCell(this, 'Metal')">${row["Metal"]}</td>
            <td contenteditable="true" onblur="updateCell(this, 'New sheets')">${row["New sheets"]}</td>
            <td contenteditable="true" onblur="updateCell(this, 'Size')">${row["Size"]}</td>
            <td contenteditable="true" onblur="updateCell(this, 'Thickness')">${row["Thickness"]}</td>
            <td contenteditable="true" onblur="updateCell(this, 'Warehouse')">${row["Warehouse"]}</td>
        `;

        tbody.appendChild(tr);
    });
}

/* ==============================
   CREATE - ADD ROW
   ============================== */

async function addRow() {
    const metal = prompt("Enter metal name:");
    if (!metal) return;

    const newSheets = prompt("Enter number of new sheets:");
    const size = prompt("Enter size, for example 500x1000:");
    const thickness = prompt("Enter thickness, for example 2mm:");
    const warehouse = prompt("Enter warehouse number:");

    const newRow = {
        "Metal": metal,
        "New sheets": parseInt(newSheets) || 0,
        "Size": size || "0x0",
        "Thickness": thickness || "0mm",
        "Warehouse": parseInt(warehouse) || 0
    };

    statusText.textContent = "Adding row...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Newsheets`,
        {
            method: "POST",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                "Content-Type": "application/json",
                Prefer: "return=representation"
            },
            body: JSON.stringify(newRow)
        }
    );

    const result = await response.json();

    if (response.ok) {
        statusText.textContent = "Row added.";
        loadTable();
    } else {
        console.error(result);
        alert("Add failed: " + result.message);
    }
}

/* ==============================
   UPDATE - EDIT CELL
   ============================== */

async function updateCell(cell, columnName) {
    const tr = cell.parentElement;
    const originalMetal = tr.dataset.metal;

    let newValue = cell.textContent.trim();

    if (columnName === "New sheets" || columnName === "Warehouse") {
        newValue = parseInt(newValue);

        if (isNaN(newValue)) {
            alert(columnName + " must be a whole number.");
            loadTable();
            return;
        }
    }

    const updatedData = {};
    updatedData[columnName] = newValue;

    statusText.textContent = "Updating...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Newsheets?Metal=eq.${encodeURIComponent(originalMetal)}`,
        {
            method: "PATCH",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updatedData)
        }
    );

    if (response.ok) {
        statusText.textContent = "Update saved.";

        if (columnName === "Metal") {
            tr.dataset.metal = newValue;
            selectedMetal = newValue;
        }

    } else {
        const err = await response.json();
        console.error(err);
        alert("Update failed: " + err.message);
        loadTable();
    }
}

/* ==============================
   DELETE - DELETE SELECTED ROW
   ============================== */

async function deleteRow() {
    if (!selectedMetal) {
        alert("Select a row first.");
        return;
    }

    if (!confirm("Delete this sheet record?")) return;

    statusText.textContent = "Deleting...";

    const response = await fetch(
        `${supabaseUrl}/rest/v1/Newsheets?Metal=eq.${encodeURIComponent(selectedMetal)}`,
        {
            method: "DELETE",
            headers: {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`
            }
        }
    );

    if (response.ok) {
        selectedMetal = null;
        statusText.textContent = "Row deleted.";
        loadTable();
    } else {
        const err = await response.json();
        console.error(err);
        alert("Delete failed: " + err.message);
    }
}

/* ==============================
   START PAGE
   ============================== */

loadTable();
</script>

</body>
</html>
