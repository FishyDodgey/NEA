<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Metal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #1e1e1e;
    color: white;
}

/* LEFT PANEL */
.welcome-container {
    position: absolute;
    left: 20px;
    top: 50px;
}

/* BUTTON STYLE (Screen B style) */
button {
    background-color: #333;
    color: white;
    border: 1px solid #555;
    padding: 6px 10px;
    margin: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #555;
}

/* TABLE */
table.inventory {
    border-collapse: collapse;
    width: 60%;
    margin: 50px auto;
    background-color: #2b2b2b;
}

table.inventory th,
table.inventory td {
    border: 1px solid #555;
    padding: 6px;
    text-align: left;
}

table.inventory th {
    background-color: #3a3a3a;
}

td[contenteditable="true"] {
    background-color: #444;
}
</style>

</head>

<body>

<!-- LEFT SIDE MENU -->
<div class="welcome-container">
    <h1>Check Metal</h1>

    <p>Select a screen:</p>
    <a href="screenA.html"><button>New Sheets</button></a><br>
    <a href="screenB.html"><button>Used Sheets</button></a><br><br>
    <a href="blank.html"><button>Return</button></a>

    <hr>

    <button onclick="addRow()">Add Metal</button>
</div>

<!-- TABLE -->
<table id="Metal1Table" class="inventory">
<tr>
    <th>Metal</th>
    <th>New Sheets</th>
    <th>Old Sheets</th>
    <th>Delete</th>
</tr>
</table>

<script>

// ===============================
// SUPABASE CONNECTION
// ===============================
const supabase = window.supabase.createClient(
    "https://dtlkoxesvryluntpkxst.supabase.co",
    "sb_publishable_oFej7rbKhkstLjb0Po5fHQ_oA7G-3u_"
);

// ===============================
// LOAD DATA (READ)
// ===============================
async function loadTable() {
    const { data, error } = await supabase
        .from("metal")
        .select("*")
        .order("metal");

    if (error) {
        console.error(error);
        alert("Error loading database");
        return;
    }

    const table = document.getElementById("Metal1Table");

    while (table.rows.length > 1) table.deleteRow(1);

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.dataset.id = row.id;

        tr.innerHTML = `
            <td>${row.metal}</td>
            <td contenteditable="true" onblur="updateRow(this)">${row.new_sheets}</td>
            <td contenteditable="true" onblur="updateRow(this)">${row.old_sheets}</td>
            <td><button onclick="deleteRow('${row.id}')">X</button></td>
        `;

        table.appendChild(tr);
    });
}

// ===============================
// UPDATE
// ===============================
async function updateRow(cell) {
    const row = cell.parentElement;
    const id = row.dataset.id;

    const newSheets = parseInt(row.children[1].textContent);
    const oldSheets = parseInt(row.children[2].textContent);

    if (isNaN(newSheets) || isNaN(oldSheets)) {
        alert("Numbers only");
        loadTable();
        return;
    }

    await supabase
        .from("metal")
        .update({
            new_sheets: newSheets,
            old_sheets: oldSheets
        })
        .eq("id", id);
}

// ===============================
// CREATE
// ===============================
async function addRow() {
    const metal = prompt("Enter metal name:");
    if (!metal) return;

    await supabase
        .from("metal")
        .insert([
            { metal: metal, new_sheets: 0, old_sheets: 0 }
        ]);

    loadTable();
}

// ===============================
// DELETE
// ===============================
async function deleteRow(id) {
    if (!confirm("Delete this metal?")) return;

    await supabase
        .from("metal")
        .delete()
        .eq("id", id);

    loadTable();
}

// ===============================
// START
// ===============================
loadTable();

</script>

</body>
</html>
